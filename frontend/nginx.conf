# Zona pembatas: 1 request per 6 detik (sekitar 10/menit) per IP
limit_req_zone $binary_remote_addr zone=kirim_pesan:10m rate=10r/m;

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Batasi ukuran body request biar gak bisa kirim data raksasa
    client_max_body_size 10k;

    # Pembatasan khusus untuk POST ke /api/pesan
    location = /api/pesan {
        limit_req zone=kirim_pesan burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://backend:4000;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Endpoint API lain (health, dll)
    location /api/ {
        proxy_pass http://backend:4000;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
